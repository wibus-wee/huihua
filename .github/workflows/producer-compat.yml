name: producer compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      both_versions:
        description: Run pinned and latest CLI versions
        type: boolean
        default: true
      publish_issues:
        description: Publish daily tracking and anomaly issues (default branch only)
        type: boolean
        default: false
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.matrix.outputs.providers }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: matrix
        run: node tools/producer-compat/catalog.ts matrix

  compatibility:
    needs: [catalog]
    name: ${{ matrix.provider.id }} (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.both_versions)) && '["pinned","latest"]' || '["pinned"]') }}
        provider: ${{ fromJSON(needs.catalog.outputs.providers) }}
    env:
      COMPAT_PROVIDER: ${{ matrix.provider.id }}
      COMPAT_LANE: ${{ matrix.lane }}
      PRODUCER_BINARY: ${{ matrix.provider.install.binary }}
    steps:
      - name: Set shared run paths
        run: |
          echo "SIMULATOR_DIR=$RUNNER_TEMP/simulator" >> "$GITHUB_ENV"
          echo "PRODUCER_BIN=$RUNNER_TEMP/producers/node_modules/.bin/$PRODUCER_BINARY" >> "$GITHUB_ENV"
          echo "COMPAT_REPORT=$RUNNER_TEMP/$COMPAT_PROVIDER-compat-report.json" >> "$GITHUB_ENV"
          echo "COMPAT_RESULT_PATH=$RUNNER_TEMP/result-$COMPAT_PROVIDER-$COMPAT_LANE.json" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned simulator and real producer
        run: |
          COMMIT=$(node -e "console.log(require('./tools/producer-compat/manifest.json').simulator.commit)")
          git clone https://github.com/wibus-wee/model-api-simulator.git "$SIMULATOR_DIR"
          git -C "$SIMULATOR_DIR" checkout --detach "$COMMIT"
          (cd "$SIMULATOR_DIR" && npm exec --yes --package=pnpm@11.24.0 -- pnpm install --frozen-lockfile)
          node tools/producer-compat/catalog.ts install
      - name: Produce native store and verify Huihua
        id: verify
        env:
          CODEX_COMPAT_UNSANDBOXED: ${{ matrix.provider.id == 'codex' && '1' || '0' }}
        run: node "tools/producer-compat/${{ matrix.provider.runner }}"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: ${{ matrix.provider.artifact }}-${{ matrix.lane }}
          path: |
            ${{ env.COMPAT_REPORT }}*
            ${{ env.COMPAT_INSTALL_MANIFEST }}
            ${{ format(matrix.provider.evidence, runner.temp) }}
          retention-days: 7
          include-hidden-files: true
      - name: Publish reading compatibility summary
        if: always()
        env:
          COMPAT_EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          COMPAT_OUTCOME: ${{ steps.verify.outcome }}
        run: node tools/producer-compat/report.ts
      - name: Upload structured lane result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-result-${{ matrix.provider.id }}-${{ matrix.lane }}
          path: ${{ env.COMPAT_RESULT_PATH }}
          retention-days: 14

  daily-report:
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: producer-compatibility-issue-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: mkdir -p "$RUNNER_TEMP/compat-results"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: compat-result-*
          path: ${{ runner.temp }}/compat-results
          merge-multiple: true
      - name: Prepare daily report (read-only)
        env:
          COMPAT_RESULTS_DIR: ${{ runner.temp }}/compat-results
          COMPAT_DAILY_REPORT: ${{ runner.temp }}/daily-compatibility.md
        run: node tools/producer-compat/publish.ts
      - name: Update tracking issue and deduplicated anomalies
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'schedule' || (inputs.publish_issues && inputs.both_versions)) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPAT_PUBLISH: 'true'
          COMPAT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COMPAT_RESULTS_DIR: ${{ runner.temp }}/compat-results
          COMPAT_DAILY_REPORT: ${{ runner.temp }}/daily-compatibility.md
        run: node tools/producer-compat/publish.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-compatibility-report
          path: ${{ runner.temp }}/daily-compatibility.md
          retention-days: 30
