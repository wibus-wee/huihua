name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wibus-wee/huihua'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - name: Verify release tag
        id: version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(name, 'huihua');
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Release tag must match package.json version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${version.includes('-') ? 'next' : 'latest'}\n`);
          JS
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check
        run: pnpm check
      - name: Pack checked build
        run: pnpm pack --config.ignore-scripts=true --pack-destination "$RUNNER_TEMP"
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.21.0
      - name: Publish with OIDC
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          NPM_TAG: ${{ steps.version.outputs.tag }}
        run: npm publish "$RUNNER_TEMP/huihua-$PACKAGE_VERSION.tgz" --access public --tag "$NPM_TAG" --registry=https://registry.npmjs.org/
